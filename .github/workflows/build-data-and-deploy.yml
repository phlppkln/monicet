# Rebuilds the app data from the raw MONICET archive, builds the site and
# publishes it to GitHub Pages.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

name: Build data and deploy

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# One deployment at a time; don't cancel a deploy that is already running.
concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Fetch raw Darwin Core Archive
              run: pnpm data:fetch

            - name: Build data
              run: pnpm data:build

            - name: Test
              run: pnpm test

            - name: Build site
              run: pnpm build

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        # PRs only build; deploy from main (or a manual run).
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
